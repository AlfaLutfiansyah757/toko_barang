name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode
      uses: actions/checkout@v4

    - name: Pasang Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Pasang Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install dependency
      working-directory: ./toko_barang
      run: flutter pub get

    - name: Build APK
      working-directory: ./toko_barang
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aplikasi-apk
        path: toko_barang/build/app/outputs/flutter-apk/app-release.apk